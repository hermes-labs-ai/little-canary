name: Publish to PyPI

# Fires when you publish a GitHub Release. That same Release also triggers
# Zenodo DOI minting (if the repo is toggled on in Zenodo) — so one action
# (publish a Release) mints the DOI AND ships to PyPI, both green.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify approved release commit and package version
        run: |
          release_commit="$(python -c 'import json, os, re; body = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["release"].get("body") or ""; matches = re.findall(r"(?m)^Release-Commit: ([0-9a-f]{40})$", body); assert len(matches) == 1, "release body must contain exactly one Release-Commit trailer"; print(matches[0])')"
          test "${release_commit}" = "${GITHUB_SHA}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/little-canary/
    permissions:
      contents: read
      id-token: write   # required for PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
