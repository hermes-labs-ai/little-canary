name: LintLang

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  language-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This version is an intentional compatibility probe. Dependabot ignores
      # it because changing LintLang semantics requires a dedicated review.
      - name: Scan agent instructions
        uses: hermes-labs-ai/lintlang@6aace2a175483757c64d7aa2105346d1cc34b857 # v0.7.1
        with:
          path: "AGENTS.md"
          fail-on: fail
          sarif-file: lintlang.sarif

      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: lintlang.sarif
