name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check little_canary/ tests/

      - name: Run tests with coverage
        run: pytest --cov=little_canary --cov-report=xml --cov-report=term-missing

      - name: Upload coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Resolve exact artifact paths
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          echo "WHEEL_PATH=$(ls "${GITHUB_WORKSPACE}"/dist/*.whl)" >> "$GITHUB_ENV"
          echo "SDIST_PATH=$(ls "${GITHUB_WORKSPACE}"/dist/*.tar.gz)" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"

      - name: Smoke-test exact wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install "${WHEEL_PATH}"
          cd /tmp
          installed_version="$(/tmp/wheel-venv/bin/python -c 'import little_canary; print(little_canary.__version__)')"
          test "${installed_version}" = "${EXPECTED_VERSION}"
          /tmp/wheel-venv/bin/little-canary --version

      - name: Smoke-test exact sdist in a fresh virtualenv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install "${SDIST_PATH}"
          cd /tmp
          installed_version="$(/tmp/sdist-venv/bin/python -c 'import little_canary; print(little_canary.__version__)')"
          test "${installed_version}" = "${EXPECTED_VERSION}"
          /tmp/sdist-venv/bin/little-canary --version
