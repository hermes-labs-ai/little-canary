name: Dependabot review activity

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Review events select this file from the PR merge context. They must not run
# actions or receive write authority. The default-branch workflow_run controller
# independently validates GitHub's run/PR records; it consumes no artifacts here.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - run: ':'
